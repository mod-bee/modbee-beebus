sentence=Peer-to-peer, multi-master, token-passing protocol for RS485 and UDP.
paragraph=Decentralised token ring carrying two data models: stock Modbus registers for gateway compatibility, and a native topic layer with typed values, publish and subscribe, data quality and store-and-forward. Transport agnostic: runs over serial or UDP on Arduino, and builds as a plain C++ library on Linux, macOS and Windows.
category=Communication
url=https://github.com/mod-bee/modbee-beebus
architectures=esp32,esp8266,samd,mbed,renesas_uno,stm32
includes=BeeBusGlobal.h

